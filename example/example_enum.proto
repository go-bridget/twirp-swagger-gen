syntax = "proto3";

package apm.v1;

option go_package = "example.com/apm";

service GradeService {
  // Read the grade of a target
  rpc Grade(GradeRequest) returns (GradeResponse);
}

message GradeRequest {
  enum Grade {
    A = 0;
    B = 1;
    C = 2;
    D = 3;
  }
  string targetURL = 1;
  string payload = 2;
  Grade grade = 3;
}

message GradeResponse {}
